      operationId: listSignatures
      summary: List signatures
      description: |
        Lists signatures visible to the caller. The route is registered, but no
        matching handler method is defined in the readable handler source, so this
        operation is **Designed**. Source: backend/internal/api/routes.go:L48.
      responses:
        '200':
          description: A list of signatures (**Designed**).
          content:
            application/json:
              schema:
                type: array
