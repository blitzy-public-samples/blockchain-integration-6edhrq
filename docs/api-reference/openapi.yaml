components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT bearer authentication. Obtain a token from `POST /auth/login`
        (response `{ "token": "..." }`) and send it on every secured request as
        the header `Authorization: Bearer <token>`. This matches the frontend
        Axios request interceptor and the router's `AuthMiddleware`. Note: the
        `middleware` package that would enforce this is **absent** in the
        scaffold, so bearer enforcement is **Designed** — no token check runs and
        the `api` package does not compile.
        Source: frontend/src/services/api.ts:L11-L16,
        Source: backend/internal/api/routes.go:L25.
  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      description: |
        Resource identifier (UUID). Gin `:id` path parameter, registered as
        `:id` on the vault, transaction, and signature groups.
        Source: backend/internal/api/routes.go:L29-L31,L39-L41,L49-L51.
        The only handler that reads it does so as an opaque string via
        `c.Param("id")` with a non-empty check and no UUID parse, so the
        `format: uuid` constraint below is the **Designed** contract rather
        than an enforced runtime validation.
        Source: backend/internal/api/handlers/transaction.go:L38-L42.
      schema:
        type: string
        format: uuid
      example: 1b4e28ba-2fa1-11d2-883f-0016d3cca427
  schemas:
    Organization:
      type: object
      description: |
        An organization (tenant). This response schema is the **Designed** safe
        DTO and deliberately **omits `apiKey`**. Security requirement (documented,
        not fixed): the persisted `Organization` struct declares `APIKey` as a
        plaintext `string` with **no `json:"-"` tag**, so if the code compiled and
        marshaled an `Organization` directly the raw API key **would be exposed**
        in every response and log. Treat the API key as a **secret**: the Designed
        contract stores only a one-way **hash/verifier** (never the raw key),
        reveals the raw key **exactly once** at creation via a separate
        creation-only shape, **never** returns it in read responses or this
        reusable DTO, and **redacts** it from logs. Omitting it here is therefore a
        Designed contract, not the current code behavior. See
        docs/security/security-model.md and docs/architecture/data-model.md
        (Sensitive & Secret Fields). Other fields mirror the GORM entity; see
        docs/architecture/data-model.md (Fig M1) for the canonical definition.
        Source: backend/internal/db/schema.go:L11-L18 (specifically L15).
      required:
        - id
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: UUID primary key.
        name:
          type: string
          description: Organization display name.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 3f1a5b2c-9d84-4c1e-8a7b-2b6d5e4f0a11
        name: Acme Custody
        createdAt: '2024-01-15T09:30:00Z'
        updatedAt: '2024-01-15T09:30:00Z'
    User:
      type: object
      description: |
        A user within an organization. This response schema is the **Designed**
        safe DTO and deliberately omits `PasswordHash`. Security defect
        (documented, not fixed): the persisted `User` struct gives `PasswordHash`
        **no `json:"-"` tag**, so if the code compiled and marshaled a `User`
        directly the password hash **would be exposed** in the JSON response.
        Omitting it here is therefore a Designed contract, not the current code
        behavior. See docs/security/security-model.md.
        Source: backend/internal/db/schema.go:L20-L30 (specifically L26).
      required:
        - id
        - organizationId
        - username
        - email
        - role
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: UUID primary key.
        organizationId:
          type: string
          format: uuid
          description: Owning organization (multi-tenancy scope).
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          description: |
            Role-based access-control role for the user (free-form string in
            code; the design corpus enumerates Admin / Manager / Operator /
            Auditor / API User). Source: backend/internal/db/schema.go:L27.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        organizationId: 3f1a5b2c-9d84-4c1e-8a7b-2b6d5e4f0a11
        username: alice
        email: alice@example.com
        role: Operator
        createdAt: '2024-01-15T09:30:00Z'
        updatedAt: '2024-01-15T09:30:00Z'
    Vault:
      type: object
      description: |
        A custodial vault holding an on-chain address. See
        docs/architecture/data-model.md (Fig M1) for the canonical definition.
        Source: backend/internal/db/schema.go:L32-L42.
      required:
        - id
        - organizationId
        - name
        - blockchainType
        - address
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: UUID primary key.
        organizationId:
          type: string
          format: uuid
          description: Owning organization (multi-tenancy scope).
        name:
          type: string
          description: Vault display name.
        blockchainType:
          type: string
          description: Target chain for the vault.
          enum:
            - XRP
            - Ethereum
        address:
          type: string
          description: On-chain address held by the custodial vault.
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata, intended to persist as JSONB via gorm.JSONMap (Designed; gorm.JSONMap is undefined in gorm.io/gorm, so it does not compile and no JSONB column is created).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 1b4e28ba-2fa1-11d2-883f-0016d3cca427
        organizationId: 3f1a5b2c-9d84-4c1e-8a7b-2b6d5e4f0a11
        name: Treasury Vault
        blockchainType: XRP
        address: "<xrp-vault-address>"
        metadata: {}
        createdAt: '2024-01-15T09:30:00Z'
        updatedAt: '2024-01-15T09:30:00Z'
    Transaction:
      type: object
      description: |
        A blockchain transaction. See docs/architecture/data-model.md (Fig M1)
        for the canonical definition.
        Source: backend/internal/db/schema.go:L44-L56.
      required:
        - id
        - userId
        - vaultId
        - status
        - blockchainType
        - amount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: UUID primary key.
        userId:
          type: string
          format: uuid
          description: The user who initiated the transaction.
        vaultId:
          type: string
          format: uuid
          description: The source vault the transaction draws from.
        status:
          type: string
          description: |
            Lifecycle status. The backend vocabulary is `Pending` / `Processed`,
            set via the `db.TransactionStatusPending` and
            `db.TransactionStatusProcessed` constants. The frontend Zod schema
            uses a different vocabulary of `Pending` / `Completed` / `Failed`.
            Source: backend/internal/core/transaction/service.go:L46,L81,
            Source: frontend/src/schema/transaction.ts:L10.
          enum:
            - Pending
            - Processed
        blockchainType:
          type: string
          description: Target chain for the transaction.
          enum:
            - XRP
            - Ethereum
        txHash:
          type: string
          description: On-chain transaction hash; populated after broadcast.
        amount:
          type: string
          description: |
            Arbitrary-precision decimal amount serialized as a string to avoid
            floating-point rounding (backed by `decimal.Decimal` in code).
            Source: backend/internal/db/schema.go:L52.
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata, intended to persist as JSONB via gorm.JSONMap (Designed; gorm.JSONMap is undefined in gorm.io/gorm, so it does not compile and no JSONB column is created).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 16fd2706-8baf-433b-82eb-8c7fada847da
        userId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        vaultId: 1b4e28ba-2fa1-11d2-883f-0016d3cca427
        status: Pending
        blockchainType: XRP
        txHash: ''
        amount: '10.5'
        metadata: {}
        createdAt: '2024-01-15T09:30:00Z'
        updatedAt: '2024-01-15T09:30:00Z'
    Signature:
      type: object
      description: |
        A custodial signature request and its result. See
        docs/architecture/data-model.md (Fig M1) for the canonical definition.
        Source: backend/internal/db/schema.go:L58-L68.
      required:
        - id
        - userId
        - vaultId
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: UUID primary key.
        userId:
          type: string
          format: uuid
          description: The user who requested the signature.
        vaultId:
          type: string
          format: uuid
          description: The vault whose key produces the signature.
        status:
          type: string
          description: |
            Signature lifecycle status — a free-form, unconstrained string in
            code. The service writes only the literal `pending`; the terminal
            states `Ready` / `Failed` are referenced via the undefined
            `signature.StatusReady` / `signature.StatusFailed` constants and are
            therefore **Designed**. The frontend Zod schema uses a divergent
            `Completed` vocabulary. Source: backend/internal/db/schema.go:L63,
            Source: backend/internal/core/signature/service.go:L30,
            Source: backend/internal/tasks/signature_processor.go:L46,L55.
        rawSignature:
          type: string
          description: |
            **Sensitive cryptographic material** (raw custodian signature bytes).
            Handling contract is **Designed** (documented, not enforced today):
            classify as sensitive, minimize retention (the settlement path caches
            the full signature object — including this field — under
            `signature:<id>` in **unencrypted** Redis for 24 hours, a retention
            concern to reduce), encrypt at rest and in transit, and **never log**.
            It should normally be **omitted** from list/read responses and
            surfaced only to authorized callers; it is retained in this schema
            solely to document the persisted field. See
            docs/security/security-model.md and docs/architecture/data-model.md
            (Sensitive & Secret Fields).
            Source: backend/internal/db/schema.go:L64,
            Source: backend/internal/tasks/signature_processor.go:L46-L58.
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata, intended to persist as JSONB via gorm.JSONMap (Designed; gorm.JSONMap is undefined in gorm.io/gorm, so it does not compile and no JSONB column is created).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        userId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        vaultId: 1b4e28ba-2fa1-11d2-883f-0016d3cca427
        status: pending
        rawSignature: ''
        metadata: {}
        createdAt: '2024-01-15T09:30:00Z'
        updatedAt: '2024-01-15T09:30:00Z'
    LoginRequest:
      type: object
      description: |
        Login credentials. Both fields are required (`binding:"required"`).
        Source: backend/internal/api/handlers/auth.go:L22-L25.
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      example:
        username: alice
        password: 'S3cret-Passphrase!'
    RegisterRequest:
      type: object
      description: |
        Registration payload. **Designed** — the fields are inferred from the
        `User` entity and the organization scope, since the `Register` handler is
        not defined in the readable handler source.
        Source: backend/internal/db/schema.go:L20-L30.
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        organizationId:
          type: string
          format: uuid
      example:
        username: alice
        email: alice@example.com
        password: 'S3cret-Passphrase!'
        organizationId: 3f1a5b2c-9d84-4c1e-8a7b-2b6d5e4f0a11
    CreateVaultRequest:
      type: object
      description: |
        Vault creation payload. Fields are inferred from the service constructor
        `VaultService.CreateVault(organizationID, name, blockchainType)`; the
        `organizationID` is resolved server-side from the JWT, not the body.
        Source: backend/internal/core/vault/service.go:L24.
      required:
        - name
        - blockchainType
      properties:
        name:
          type: string
        blockchainType:
          type: string
          enum:
            - XRP
            - Ethereum
      example:
        name: Treasury Vault
        blockchainType: XRP
    UpdateVaultRequest:
      type: object
      description: |
        Vault update payload. **Designed** — fields inferred; the update handler
        is not defined in the readable handler source.
        Source: backend/internal/api/routes.go:L30.
      properties:
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true
      example:
        name: Treasury Vault (renamed)
        metadata:
          tier: cold
    CreateTransactionRequest:
      type: object
      description: |
        Transaction creation payload. Fields are inferred from the service
        constructor
        `TransactionService.CreateTransaction(userID, vaultID, toAddress, amount)`;
        the `userID` is resolved server-side from the JWT, not the body.
        Source: backend/internal/core/transaction/service.go:L29.

        Request-field divergence (behavioral divergence; Designed to reconcile).
        The only client that builds this payload sends the destination under the
        key `recipientAddress`, not `toAddress`, and sends `amount` as a JSON
        number rather than a decimal string: `TransactionForm` dispatches
        `createTransaction({ vaultId, amount: parseFloat(amount),
        recipientAddress })`, the thunk forwards it unchanged, and
        `api.createTransaction` POSTs it verbatim.
        Source: frontend/src/components/TransactionForm.tsx:L13,L34;
        frontend/src/store/transactionSlice.ts:L10;
        frontend/src/services/api.ts:L38-L42.
        Because the handler binds with `ShouldBindJSON`, never enables
        `DisallowUnknownFields`, and the repository declares only two
        `binding:"required"` tags (both on the login body), the unrecognized key
        would be ignored and the destination left at its zero value rather than
        rejected with 400.
        Source: backend/internal/api/handlers/transaction.go:L22-L26;
        backend/internal/api/handlers/auth.go:L23-L24.
        `toAddress` as specified here is authoritative for this API; the client
        key is the side that must change. The mismatch is latent - neither layer
        builds at this checkpoint, and `transaction.CreateTransactionRequest` is
        referenced by the handler but declared nowhere in the readable source,
        which is why this shape is inferred from the service signature.
        Source: backend/internal/api/handlers/transaction.go:L22.
      required:
        - vaultId
        - toAddress
        - amount
      properties:
        vaultId:
          type: string
          format: uuid
        toAddress:
          type: string
          description: >-
            Destination on-chain address. Authoritative field name. The frontend
            client sends this value as `recipientAddress` instead, which the
            server would silently ignore - see the schema description.
        amount:
          type: string
          description: >-
            Arbitrary-precision decimal amount serialized as a string. The
            frontend client sends a JSON number (`parseFloat`) instead.
      example:
        vaultId: 1b4e28ba-2fa1-11d2-883f-0016d3cca427
        toAddress: "<xrp-destination-address>"
        amount: '10.5'
    UpdateTransactionRequest:
      type: object
      description: |
        Transaction update payload. **Designed** — fields inferred; the update
        handler is not defined in the readable handler source. The `status` uses
        the backend vocabulary `Pending` / `Processed`.
        Source: backend/internal/api/routes.go:L40,
        Source: backend/internal/core/transaction/service.go:L46,L81.
      properties:
        status:
          type: string
          enum:
            - Pending
            - Processed
      example:
        status: Processed
    CreateSignatureRequest:
      type: object
      description: |
        Signature request payload. Fields are inferred from the service
        constructor
        `SignatureService.RequestSignature(userID, vaultID, dataToSign)`; the
        `userID` is resolved server-side from the JWT, not the body. `dataToSign`
