                error: Transaction not found
    delete:
      tags:
        - Transactions
      operationId: deleteTransaction
      summary: Delete a transaction
      description: |
        Deletes a transaction by its UUID. The route is registered, but its
        handler method is not defined, so this operation is **Designed**.
        Source: backend/internal/api/routes.go:L41.
      responses:
        '204':
          description: Transaction deleted; no content (**Designed**).
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Unauthorized
        '404':
          description: Transaction not found (**Designed**).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Transaction not found

  /signatures/create:
    post:
      tags:
        - Signatures
      operationId: createSignature
      summary: Request a signature
      description: |
        Requests a custodial signature over the supplied payload for a vault's
        key. The router references a `CreateSignature` handler, but only
        `GetRawSignature` and `CheckSignatureStatus` are defined in the handler
        source (handler/route name mismatch), so this operation is **Designed**.
        Source: backend/internal/api/routes.go:L47.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSignatureRequest'
            example:
              vaultId: 1b4e28ba-2fa1-11d2-883f-0016d3cca427
